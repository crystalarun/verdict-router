[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verdict-router"
version = "0.1.0"
description = "Cost-aware route labels for Verdict Desk. No paid model calls in v0.1."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Arun Kumar" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
